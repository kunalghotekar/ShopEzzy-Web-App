<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Register</title>

    <link rel="stylesheet"
          th:href="@{/css/register.css}">
<link rel="stylesheet"
          th:href="@{/css/navbar.css}">
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>
<div class="main">
<div class="container">

<form action="/register" method="post">

    <h2>Create Account</h2>

    <input type="text"
           name="name"
           placeholder="Enter Name">

    <input type="email"
           name="email"
           placeholder="Enter Email">

    <input type="password"
           name="password"
           placeholder="Enter Password">

    <button type="submit">
        Register
    </button>

</form>

</div>
</div>
</body>
</html>
