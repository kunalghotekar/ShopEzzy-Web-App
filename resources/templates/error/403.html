<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">

    <title>403 Forbidden</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }

        .container {
            background: white;
            padding: 40px;
            width: 400px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 70px;
            color: #e53935;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        a {
            text-decoration: none;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #222;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #444;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>403</h1>

    <h2>Access Forbidden</h2>

    <p>
        You do not have permission
        to access this page.
    </p>

    <a th:href="@{/products}">

        <button>
            Back To Products
        </button>

    </a>

</div>

</body>
</html>
